[build-system]
requires = ["setuptools>=77.0.0", "build>=1.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "githubtemplateastraluv"
version = "0.0.8"
description = "GitHub template for Astral-UV app."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "Francesco Rolando" }
]
keywords = ["shell", "scripts", "uv", "astral", "uvx", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

dependencies = [
]

[dependency-groups]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Ogekuri/GitHub-Template-AstralUV"
Repository = "https://github.com/Ogekuri/GitHub-Template-AstralUV"

[project.scripts]
githubtemplateastraluv = "githubtemplateastraluv.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["githubtemplateastraluv", "githubtemplateastraluv.*"]

[tool.setuptools.package-data]
githubtemplateastraluv = ["*.py"]
